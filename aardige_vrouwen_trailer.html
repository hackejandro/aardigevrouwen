<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aardige Vrouwen — Megan van Kessel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --red:#E8300A; }
  html,body{height:100%;overflow:hidden;background:var(--red);}
  body{
    font-family:'Playfair Display',Georgia,serif;
    color:#fff;
    -webkit-font-smoothing:antialiased;
  }

  /* horizontal track */
  #track{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:row;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -ms-overflow-style:none;
    cursor:default;
  }
  #track::-webkit-scrollbar{display:none;}

  .panel{
    flex:0 0 100vw;
    width:100vw;
    height:100vh;
    height:100dvh;
    scroll-snap-align:center;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:7vh 8vw;
    position:relative;
  }

  /* quote panels */
  .quote{
    max-width:760px;
    text-align:center;
    font-style:italic;
    line-height:1.18;
    font-weight:900;
    letter-spacing:-0.01em;
  }
  .quote .w{
    display:inline-block;
    opacity:0;
    transform:translateY(18px);
    filter:blur(6px);
    transition:opacity .55s cubic-bezier(.2,.7,.2,1),
               transform .55s cubic-bezier(.2,.7,.2,1),
               filter .55s cubic-bezier(.2,.7,.2,1);
    white-space:pre;
  }
  .quote .w.on{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }

  .quote.xs { font-size:clamp(21px,3.4vw,32px); font-weight:700; line-height:1.32; }
  .quote.sm { font-size:clamp(24px,4.2vw,40px); font-weight:700; line-height:1.26; }
  .quote.md { font-size:clamp(29px,5.2vw,50px); font-weight:900; line-height:1.2; }
  .quote.lg { font-size:clamp(38px,6.6vw,66px); font-weight:900; line-height:1.12; }
  .quote.xl { font-size:clamp(48px,8vw,86px); font-weight:900; line-height:1.06; }
  .quote.xxl{ font-size:clamp(54px,9vw,104px); font-weight:900; line-height:1.02; }

  /* tiny quote index under each quote */
  .idx{
    position:absolute;
    bottom:7vh;
    left:0;right:0;
    text-align:center;
    font-size:11px;
    letter-spacing:.4em;
    text-transform:uppercase;
    font-style:normal;
    font-weight:400;
    color:rgba(255,255,255,.45);
    opacity:0;
    transition:opacity .8s ease .25s;
  }
  .panel.active .idx{opacity:1;}

  /* title bookend panels */
  .author-top{
    font-size:clamp(11px,1.4vw,13px);
    letter-spacing:.45em;
    text-transform:uppercase;
    color:#fff;
    margin-bottom:3.5vh;
    font-weight:400;
    text-align:center;
  }
  .mega{
    font-weight:900;
    font-style:italic;
    color:#fff;
    line-height:.86;
    text-align:center;
    font-size:clamp(84px,22vw,260px);
    letter-spacing:-0.02em;
  }
  .publisher{
    font-size:clamp(10px,1.3vw,12px);
    letter-spacing:.4em;
    text-transform:uppercase;
    color:rgba(255,255,255,.6);
    margin-top:4vh;
    text-align:center;
  }
  .title-panel .author-top,
  .title-panel .mega,
  .title-panel .publisher,
  .title-panel .scroll-hint{
    opacity:0;
    transform:translateY(22px);
    filter:blur(8px);
    transition:opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1), filter 1s cubic-bezier(.2,.7,.2,1);
  }
  .title-panel.active .author-top{opacity:1;transform:none;filter:none;transition-delay:.1s;}
  .title-panel.active .mega{opacity:1;transform:none;filter:none;transition-delay:.35s;}
  .title-panel.active .publisher{opacity:1;transform:none;filter:none;transition-delay:.6s;}
  .title-panel.active .scroll-hint{opacity:1;transform:none;filter:none;transition-delay:.9s;}

  .scroll-hint{
    position:absolute;
    bottom:6vh;left:0;right:0;
    text-align:center;
    font-size:11px;
    letter-spacing:.35em;
    text-transform:uppercase;
    font-style:normal;
    font-weight:400;
    color:rgba(255,255,255,.7);
  }
  .scroll-hint .arrow{
    display:block;
    margin:1.1rem auto 0;
    width:22px;height:22px;
    border-right:2px solid rgba(255,255,255,.7);
    border-bottom:2px solid rgba(255,255,255,.7);
    transform:rotate(-45deg);
    animation:nudge 1.8s ease-in-out infinite;
  }
  @keyframes nudge{
    0%,100%{transform:rotate(-45deg) translate(0,0);opacity:.4;}
    50%{transform:rotate(-45deg) translate(6px,6px);opacity:1;}
  }

  /* progress bar */
  #progress{
    position:fixed;left:0;bottom:0;height:3px;width:0%;
    background:#fff;z-index:50;
    transition:width .12s linear;
  }
  #counter{
    position:fixed;top:max(18px,3vh);right:max(18px,3vw);
    z-index:50;
    font-size:12px;letter-spacing:.25em;
    color:rgba(255,255,255,.65);
    font-variant-numeric:tabular-nums;
    font-style:normal;font-weight:400;
  }

  @media (prefers-reduced-motion: reduce){
    .quote .w{transition:none !important;}
    .scroll-hint .arrow{animation:none;}
  }
</style>
</head>

n. Haar ogen werden glazig.\""}, {"c": "md", "t": "\"'Wat een lelijke jurk heeft ze aan zeg.'\""}, {"c": "sm", "t": "\"Een donkere huid, lichte ogen, ranke armen.\""}, {"c": "xs", "t": "\"Die genieten er juist van als jij daar met je uitgroei en je doorlopende wenkbrauw ligt.\""}, {"c": "md", "t": "\"Ze droeg zelfs een kroon op haar hoofd.\""}, {"c": "sm", "t": "\"Ze droeg een tutu over haar spijkerbroek.\""}, {"c": "xs", "t": "\"Ik had mijn donkerste broek aan en een broche in de vorm van een roos op mijn jas gespeld.\""}, {"c": "md", "t": "\"Ze had gezegd dat een paarse broche ook mooi zou zijn omdat dit paste bij mijn paarse handschoenen en als je accessoires in dezelfde kleur droeg, het oog rust kreeg.\""}, {"c": "xs", "t": "\"Ik liep een heel stuk langs de suikerbietenvelden en de appelgaarden in mijn donkere broek die lekker warm was.\""}, {"c": "sm", "t": "\"Dolores knoopte haar sjaal los en er spreidde een geur van wasverzachter.\""}, {"c": "lg", "t": "\"Om half vijf viste Dolores de blauwe baret uit de kast. Ze draaide hem rond haar wijsvinger en zette hem op haar hoofd.\""}, {"c": "xs", "t": "\"Alleen een streep huid met wat kant.\""}, {"c": "md", "t": "\"Er ging iets van haar uit dat bleef hangen, ze rook naar dure parfum en haar schoenenneuzen glansden.\""}, {"c": "xs", "t": "\"Dolores keek naar haar schoenen met een blik op haar gezicht die zowel schaamte als onverschilligheid suggereerde.\""}, {"c": "sm", "t": "\"Haar haren zaten netjes.\""}, {"c": "xs", "t": "\"'Achter die deur kun je je spullen kwijt.' Er zat een klein spatje zeepsop op haar kin.\""}, {"c": "md", "t": "\"Dolores had wel iets weg van Napoleon, dezelfde ronde witte wangen.\""}, {"c": "sm", "t": "\"Ze was gekleed in een herenhemd en een beige broek, haar haren had ze in een staart gebonden, ze was mooi.\""}, {"c": "xs", "t": "\"Ik zag mezelf voorbijkomen in een goud omlijste spiegel, mijn oren leken meer te flappen dan normaal.\""}, {"c": "xl", "t": "\"Mijn moeder droeg een zonnebril me e bar, 'wat lijk jij op je zus, jullie hebben precies dezelfde stem.'\""}, {"c": "xs", "t": "\"Ze droeg zelfgemaakte kralenoorbellen en haar tanden waren scheef, dat viel me nu pas op.\""}, {"c": "sm", "t": "\"Onze benen in elkaar gestrengeld, lippen stijf op elkaar en alles doen om aan iets anders te denken.\""}, {"c": "xxl", "t": "\"Ik had haar moeten zeggen dat ze niet zo hoefde te doen, dat ze zonder opsmuk mooier was.\""}, {"c": "xs", "t": "\"Ik had niets om kapot te slaan, mijn kleren zaten in een plastic zak, en ik droeg een donkerblauw katoenen pak.\""}, {"c": "sm", "t": "\"Zonder me aan te kijken droeg hij me over aan een vrouwelijke collega met een zonnebankbruin gezicht en een duifgrijze uitgroei, ze keek me niet een keer aan.\""}, {"c": "xs", "t": "\"Zodra ik mijn diploma heb ben ik weg.' Ik wreef in mijn ogen en was vergeten dat ik mascara op had, stopte mijn vinger in mijn mond en probeerde het zwart onder mijn ogen weg te poetsen.\""}, {"c": "md", "t": "\"Ze zei niets over de leverkleurige trui die mijn moeder over haar pyjama droeg, de bril schots en scheef, het dienblad met dertig geplette bitterballen.\""}, {"c": "xs", "t": "\"Het beeld wanneer ze zo afgestemd samenwerkten in die witte koksuniformen, was een mooi gezicht.\""}, {"c": "sm", "t": "\"'Je blouse zit scheef geknoopt.'\""}, {"c": "lg", "t": "\"Zij had de aantrekkingskracht van vrouwen die weten dat ze mooi zijn, en zonder zich ergens wat van aan te trekken tomatensoep maken in een wit mantelpak.\""}, {"c": "xs", "t": "\"Ik slikte en vroeg me af of dit iets met mijn make-up te maken had.\""}, {"c": "sm", "t": "\"Eerder die avond had Dolores uitgelegd dat lippenstift én mascara ordinair was.\""}, {"c": "md", "t": "\"Voordat we vertrokken, ging ik naar het toilet en smeerde nog wat mascara, oogschaduw en donkerpaarse lippenstift op.\""}, {"c": "xs", "t": "\"Ze zwaaide wild met haar armen, tuitte haar mond zoals ze geoefend had bij het Jezuskruis.\""}, {"c": "sm", "t": "\"Er was een hittegolf const track = document.getElementById('track');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function titlePanel(word, opts){
  const p = document.createElement('section');
  p.className = 'panel title-panel';
  let inner = '';
  if(opts.author) inner += '<p class="author-top">Megan van Kessel</p>';
  inner += '<h1 class="mega">'+word+'</h1>';
  if(opts.publisher) inner += '<p class="publisher">Nijgh &amp; Van Ditmar</p>';
  if(opts.hint) inner += '<div class="scroll-hint">scroll<span class="arrow"></span></div>';
  p.innerHTML = inner;
  return p;
}

track.appendChild(titlePanel('aardige', {author:true, hint:true}));

const panels = [];
QUOTES.forEach((q, i) => {
  const sec = document.createElement('section');
  sec.className = 'panel quote-panel';
  const fig = document.createElement('div');
  fig.className = 'quote ' + q.c;
  const tokens = q.t.split(/(\s+)/);
  const spans = [];
  tokens.forEach(tok => {
    if(tok.trim()===''){ fig.appendChild(document.createTextNode(tok)); return; }
    const s = document.createElement('span');
    s.className = 'w';
    s.textContent = tok;
    fig.appendChild(s);
    spans.push(s);
  });
  sec.appendChild(fig);
  const idx = document.createElement('div');
  idx.className = 'idx';
  idx.textContent = String(i+1).padStart(3,'0') + ' / ' + QUOTES.length;
  sec.appendChild(idx);
  track.appendChild(sec);
  panels.push({el:sec, words:spans, shown:0, count:spans.length});
});

track.appendChild(titlePanel('vrouwen', {publisher:true}));

const allPanels = Array.from(track.querySelectorAll('.panel'));

if(reduce){
  panels.forEach(p=>{ p.words.forEach(w=>w.classList.add('on')); p.shown=p.count; });
}

function revealPanel(p, target){
  if(target <= p.shown) return;
  for(let k=p.shown; k<target; k++){
    const localDelay = (k - p.shown) * 45;
    const span = p.words[k];
    if(localDelay>0){ setTimeout(()=>span.classList.add('on'), localDelay); }
    else span.classList.add('on');
  }
  p.shown = target;
}

let vw = window.innerWidth;
const counter = document.getElementById('counter');

function onScroll(){
  const sl = track.scrollLeft;
  const center = sl + vw/2;
  const revealWindow = vw * 0.85;
  let activeIndex = Math.round(sl / vw);

  panels.forEach(p=>{
    const el = p.el;
    const pc = el.offsetLeft + el.offsetWidth/2;
    const dist = pc - center;
    let prog = 1 - (dist / revealWindow);
    if(prog < 0) prog = 0;
    if(prog > 1) prog = 1;
    const target = Math.ceil(prog * p.count);
    if(target > p.shown) revealPanel(p, target);
  });

  allPanels.forEach((el,i)=> el.classList.toggle('active', i===activeIndex));

  const max = track.scrollWidth - track.clientWidth;
  const frac = max>0 ? sl/max : 0;
  document.getElementById('progress').style.width = (frac*100)+'%';
  const total = QUOTES.length;
  if(activeIndex===0){ counter.textContent=''; }
  else if(activeIndex===allPanels.length-1){ counter.textContent='— fin —'; }
  else { counter.textContent = String(activeIndex).padStart(2,'0')+' · '+total; }
}

let ticking=false;
track.addEventListener('scroll', ()=>{
  if(!ticking){ requestAnimationFrame(()=>{ onScroll(); ticking=false; }); ticking=true; }
}, {passive:true});

window.addEventListener('resize', ()=>{ vw = window.innerWidth; onScroll(); });

track.addEventListener('wheel', (e)=>{
  const dom = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if(Math.abs(dom) < 1) return;
  e.preventDefault();
  track.scrollLeft += dom;
}, {passive:false});

function go(dir){
  const sl = track.scrollLeft;
  const i = Math.round(sl/vw);
  const ni = Math.min(allPanels.length-1, Math.max(0, i+dir));
  track.scrollTo({left: ni*vw, behavior:'smooth'});
}
window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ e.preventDefault(); track.scrollTo({left:0,behavior:'smooth'}); }
  else if(e.key==='End'){ e.preventDefault(); track.scrollTo({left:(allPanels.length-1)*vw,behavior:'smooth'}); }
});

let tsX=0, tsY=0, tScroll=0, touching=false;
track.addEventListener('touchstart',(e)=>{
  if(e.touches.length!==1) return;
  tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; tScroll=track.scrollLeft; touching=true;
},{passive:true});
track.addEventListener('touchmove',(e)=>{
  if(!touching||e.touches.length!==1) return;
  const dx = tsX - e.touches[0].clientX;
  const dy = tsY - e.touches[0].clientY;
  if(Math.abs(dy) > Math.abs(dx)){
    track.scrollLeft = tScroll + dy;
  }
},{passive:true});
track.addEventListener('touchend',()=>{ touching=false; },{passive:true});

onScroll();
</script>
